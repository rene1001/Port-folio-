      (function() {
        try {
          var _origFetch = window.fetch;
          var _currentFetch = function() {
            return _origFetch.apply(this, arguments);
          };
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            }
          });
        } catch (e) {}
      })();
    </script>
